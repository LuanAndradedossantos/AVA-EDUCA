  <script type="module">
  import { Aluno } from "./js/aluno.js";
  import { cadastrarAluno } from "./js/alunos.js";

  // Simula os dados que viriam de um formulário preenchido.
  const novoAluno = new Aluno({
    nome: "João Pedro Alves",
    genero: "Masculino",
    dataNascimento: "2000-03-10",
    cpf: "111.222.333-44",
    telefone: "(11) 91234-5678",
    email: "joao.alves@email.com",
    cep: "01310-000",
    cidade: "São Paulo",
    estado: "SP",
    logradouro: "Av. Paulista",
    numero: "1000",
    complemento: "",
    bairro: "Bela Vista"
  });

  console.log("Objeto criado pela classe (sem id ainda):", novoAluno);

  cadastrarAluno(novoAluno)
    .then((msg) => console.log(msg))
    .catch((erro) => console.error(erro));
</script>
