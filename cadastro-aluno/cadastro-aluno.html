<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Aluno - AVA-EDUCA+</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="cadastro-aluno.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
   
</head>
<body>
  <header id="cabecalho"></header>

  <div class="layout-corpo">
    <nav id="menu-lateral"></nav>

    <main>
      <h1>Cadastro de Aluno</h1>

      <form id="form-aluno">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" minlength="4" maxlength="80" required>

        <label for="genero">Gênero</label>
        <select id="genero" required>
          <option value="">Selecione</option>
          <option value="Masculino">Masculino</option>
          <option value="Feminino">Feminino</option>
          <option value="Outro">Outro</option>
        </select>

        <label for="dataNascimento">Data de Nascimento (DD/MM/AAAA)</label>
        <input type="text" id="dataNascimento" placeholder="DD/MM/AAAA" required>

        <label for="cpf">CPF</label>
        <input type="text" id="cpf" required>
        
        <label for="telefone">Telefone</label>
        <input type="text" id="telefone" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" required>

        <fieldset>
          <legend>Endereço</legend>

          <label for="cep">CEP</label>
          <input type="text" id="cep" required>

          <label for="cidade">Cidade</label>
          <input type="text" id="cidade" required>

          <label for="estado">Estado</label>
          <input type="text" id="estado" required>

          <label for="logradouro">Logradouro</label>
          <input type="text" id="logradouro" required>

          <label for="numero">Número</label>
          <input type="text" id="numero" required>

          <label for="complemento">Complemento</label>
          <input type="text" id="complemento" required>

          <label for="bairro">Bairro</label>
          <input type="text" id="bairro" required>
        </fieldset>

        <p id="mensagem-aluno"></p>

        <button type="submit">Salvar</button>
      </form>
    </main>
  </div>

<script type="module" src="cadastro-aluno.js" defer></script>
</body>
</html>
